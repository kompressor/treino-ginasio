name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle assembleRelease --no-daemon

      - name: Publicar a APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk treino-ginasio.apk
          gh release delete ultima -y --cleanup-tag || true
          gh release create ultima treino-ginasio.apk \
            --title "Treino Ginásio 1.0.${{ github.run_number }}" \
            --notes "Descarregar treino-ginasio.apk e instalar no telemóvel."
