name: Compilar mostrador

on:
  push:
    branches: [mostrador-fr965]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      AGREEMENT_HASH: ${{ secrets.GARMIN_AGREEMENT_HASH }}
      DEVELOPER_KEY_B64: ${{ secrets.DEVELOPER_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar gestor do SDK Connect IQ
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -s https://raw.githubusercontent.com/lindell/connect-iq-sdk-manager-cli/master/install.sh | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verificar segredos
        run: |
          if [ -z "$GARMIN_USERNAME" ] || [ -z "$GARMIN_PASSWORD" ]; then
            echo "::error::Faltam os segredos GARMIN_USERNAME e GARMIN_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Aceitar licenca, entrar na conta Garmin e descarregar SDK + FR965
        run: |
          if [ -n "$AGREEMENT_HASH" ]; then
            connect-iq-sdk-manager agreement accept --agreement-hash="$AGREEMENT_HASH"
          else
            connect-iq-sdk-manager agreement accept
          fi
          connect-iq-sdk-manager login
          connect-iq-sdk-manager sdk set "^8"
          echo "$(connect-iq-sdk-manager sdk current-path --bin)" >> "$GITHUB_PATH"
          connect-iq-sdk-manager device download --manifest=manifest.xml

      - name: Chave de programador
        run: |
          if [ -n "$DEVELOPER_KEY_B64" ]; then
            echo "$DEVELOPER_KEY_B64" | base64 -d > developer_key.der
          else
            openssl genrsa -out key.pem 4096
            openssl pkcs8 -topk8 -inform PEM -outform DER -in key.pem -out developer_key.der -nocrypt
          fi

      - name: Compilar para o Forerunner 965
        run: |
          mkdir -p bin
          monkeyc -f monkey.jungle -d fr965 -o bin/JorgeVerde.prg -y developer_key.der -w

      - uses: actions/upload-artifact@v4
        with:
          name: JorgeVerde-fr965
          path: bin/JorgeVerde.prg
