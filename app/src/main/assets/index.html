<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treino Ginásio</title>
<style>
/* Estilo macOS: listas agrupadas, translucidez, acento azul do sistema */
:root{
  --bg:#f2f2f7; --grupo:#ffffff; --campo:#e9e9ee; --sep:rgba(60,60,67,.16);
  --txt:#1c1c1e; --mut:#8a8a8e; --acc:#007aff; --acc-suave:rgba(0,122,255,.12);
  --ok:#34c759; --ok-suave:rgba(52,199,89,.14); --err:#ff3b30; --laranja:#ff9500; --roxo:#af52de;
  --vidro:rgba(249,249,251,.78); --hud:rgba(30,30,32,.82); --hud-txt:#fff;
  --sombra:0 1px 2px rgba(0,0,0,.04),0 2px 10px rgba(0,0,0,.04);
  --r:12px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Roboto,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --grupo:#1c1c1e; --campo:#2c2c2e; --sep:rgba(84,84,88,.55);
  --txt:#f2f2f7; --mut:#98989f; --acc:#0a84ff; --acc-suave:rgba(10,132,255,.2);
  --ok:#30d158; --ok-suave:rgba(48,209,88,.18); --err:#ff453a; --laranja:#ff9f0a; --roxo:#bf5af2;
  --vidro:rgba(28,28,30,.78); --hud:rgba(58,58,60,.86); --hud-txt:#fff; --sombra:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --grupo:#1c1c1e; --campo:#2c2c2e; --sep:rgba(84,84,88,.55);
  --txt:#f2f2f7; --mut:#98989f; --acc:#0a84ff; --acc-suave:rgba(10,132,255,.2);
  --ok:#30d158; --ok-suave:rgba(48,209,88,.18); --err:#ff453a; --laranja:#ff9f0a; --roxo:#bf5af2;
  --vidro:rgba(28,28,30,.78); --hud:rgba(58,58,60,.86); --hud-txt:#fff; --sombra:none; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:17px/1.35 var(--f);-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* barra superior translúcida */
.barra{position:sticky;top:0;z-index:4;background:var(--vidro);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:8px;min-height:48px}
.barra .tit{flex:1;text-align:center;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra .lado{min-width:72px;display:flex}
.barra .lado.dir{justify-content:flex-end}
.lnk{background:none;border:0;color:var(--acc);font:inherit;font-size:17px;padding:4px 0;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.lnk.forte{font-weight:600}
.lnk.perigo{color:var(--err)}
.crono{font-variant-numeric:tabular-nums;color:var(--mut);font-size:15px}

header.grande{padding:calc(18px + env(safe-area-inset-top,0px)) 20px 6px}
header.grande h1{margin:0;font-size:34px;font-weight:700;letter-spacing:.3px;line-height:1.15}
header.grande .sub{color:var(--mut);font-size:15px;margin-top:2px}

main{padding:0 16px}
.sec{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin:26px 16px 7px}
.rodape{font-size:13px;color:var(--mut);margin:7px 16px 0;line-height:1.4}

/* grupos estilo Definições do Sistema */
.grupo{background:var(--grupo);border-radius:var(--r);overflow:hidden;box-shadow:var(--sombra)}
.lin{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:52px;position:relative;cursor:default}
.lin + .lin::before{content:"";position:absolute;top:0;right:0;left:60px;border-top:.5px solid var(--sep)}
.lin.sem-ic + .lin.sem-ic::before,.lin.sem-ic + .lin::before{left:16px}
.lin.toque{cursor:pointer}
.lin.toque:active{background:var(--campo)}
.ic{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:17px;flex:none}
.ic.azul{background:var(--acc)} .ic.laranja{background:var(--laranja)} .ic.verde{background:var(--ok)} .ic.roxo{background:var(--roxo)} .ic.cinza{background:#8e8e93}
.lin .corpo{flex:1;min-width:0}
.lin .t{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lin .d{font-size:14px;color:var(--mut);margin-top:1px}
.lin .v{color:var(--mut);font-size:15px;white-space:nowrap}
.lin .chev{color:#c4c4c7;font-size:15px}
.pilula{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--acc-suave);color:var(--acc);margin-left:6px;vertical-align:2px}
.pilula.verde{background:var(--ok-suave);color:var(--ok)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:var(--r);padding:14px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--grupo);color:var(--acc);box-shadow:var(--sombra)}
.btn.pri{background:var(--acc);color:#fff}
.btn.perigo{color:var(--err)}
.btn:active{opacity:.7}
.msg{font-size:14px;color:var(--mut);padding:8px 16px 0}
.msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
.aviso{display:flex;align-items:center;gap:10px;background:var(--ok-suave);color:var(--txt);border-radius:var(--r);padding:12px 14px;margin-top:14px;font-size:15px}
.aviso svg{color:var(--ok);font-size:20px}
.vazio{padding:18px 16px;color:var(--mut);font-size:15px;text-align:center}

/* sessão */
.progresso{height:4px;background:var(--campo);border-radius:4px;overflow:hidden;margin:14px 4px 4px}
.progresso i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .3s}
.ex-tit{display:flex;align-items:baseline;gap:8px;margin:24px 16px 7px}
.ex-tit h3{margin:0;font-size:20px;font-weight:700;flex:1;letter-spacing:-.3px}
.ex-tit .feito{color:var(--ok);font-size:20px;display:flex}
.ult{font-size:13px;color:var(--mut);margin:-2px 16px 8px}
.serie{display:grid;grid-template-columns:54px 1fr 1fr 44px;gap:10px;align-items:center;padding:8px 12px 8px 16px;position:relative}
.serie + .serie::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.serie .n{color:var(--mut);font-size:15px;font-variant-numeric:tabular-nums}
.campo{position:relative}
.campo input{width:100%;background:var(--campo);border:0;color:var(--txt);border-radius:8px;padding:9px 38px 9px 12px;font:inherit;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;outline:none;transition:box-shadow .15s}
.campo input:focus{box-shadow:0 0 0 3px var(--acc-suave),inset 0 0 0 1px var(--acc)}
.campo span{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:13px;pointer-events:none}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid #c7c7cc;background:none;display:grid;place-items:center;cursor:pointer;color:transparent;font-size:18px;padding:0;justify-self:center;transition:all .15s}
.serie.ok .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.serie.ok input{color:var(--ok)}
.addser{border-top:.5px solid var(--sep)}
.addser .lnk{padding:12px 16px;font-size:15px;width:100%;justify-content:flex-start}
.notas{white-space:pre-wrap;color:var(--mut);font-size:15px;padding:12px 16px;line-height:1.45}

/* HUD do descanso, estilo notificação macOS */
#timer{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;display:none;align-items:center;gap:14px;
  background:var(--hud);color:var(--hud-txt);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
  border-radius:18px;padding:12px 12px 12px 14px;box-shadow:0 10px 40px rgba(0,0,0,.28);border:.5px solid rgba(255,255,255,.12)}
#timer.on{display:flex;animation:entra .25s ease-out}
@keyframes entra{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){#timer.on{animation:none}.progresso i{transition:none}}
.anel{position:relative;width:52px;height:52px;flex:none}
.anel svg{width:52px;height:52px;transform:rotate(-90deg)}
.anel circle{fill:none;stroke-width:4}
.anel .fundo{stroke:rgba(255,255,255,.18)}
.anel .frente{stroke:var(--laranja);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
#timer.fim .anel .frente{stroke:var(--ok)}
.anel b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
#timer .txt{flex:1;min-width:0}
#timer .tt{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
#timer .lb{font-size:13px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timer button{border:0;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;font:inherit;font-size:14px;font-weight:600;padding:9px 11px;cursor:pointer}

/* barra de separadores translúcida */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--vidro);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;font-weight:500;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{font-size:25px}
nav button.on{color:var(--acc)}

/* histórico */
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stats div{padding:12px 10px;text-align:center;position:relative}
.stats div + div::before{content:"";position:absolute;left:0;top:12px;bottom:12px;border-left:.5px solid var(--sep)}
.stats b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.stats small{color:var(--mut);font-size:12px}
.stats.duas{grid-template-columns:repeat(2,1fr)}
.graf{padding:4px 12px 12px}
.graf svg text{fill:var(--mut);font-size:11px;font-family:var(--f)}
.sel{position:relative;padding:8px 16px;border-bottom:.5px solid var(--sep)}
select{width:100%;appearance:none;-webkit-appearance:none;background:transparent;border:0;color:var(--acc);font:inherit;font-weight:600;padding:6px 0;outline:none}
.sel::after{content:"⌄";position:absolute;right:18px;top:8px;color:var(--acc);font-size:18px;pointer-events:none}

/* definições */
.form .lin{gap:10px}
.form label{width:110px;flex:none;font-size:17px}
.form input{flex:1;min-width:0;border:0;background:none;color:var(--txt);font:inherit;text-align:right;outline:none;padding:4px 0}
.form input::placeholder{color:#c4c4c7}
textarea{width:100%;min-height:120px;border:0;background:var(--grupo);color:var(--txt);border-radius:var(--r);padding:12px 14px;font:12px/1.4 ui-monospace,Menlo,monospace;outline:none;box-shadow:var(--sombra)}
.versao{text-align:center;color:var(--mut);font-size:13px;margin:26px 0 8px}

.mostra{margin-top:10px}
.mostra .r{display:flex;justify-content:space-between;gap:12px}
.mostra .r .v{text-align:right}
</style>
</head>
<body>
<div id="app"></div>
<div id="timer" role="status">
  <div class="anel"><svg viewBox="0 0 52 52"><circle class="fundo" cx="26" cy="26" r="22"/><circle class="frente" id="arco" cx="26" cy="26" r="22" stroke-dasharray="138.2" stroke-dashoffset="0"/></svg><b id="tseg"></b></div>
  <div class="txt"><div class="tt" id="tt">0:00</div><div class="lb" id="tlb">Descanso</div></div>
  <button id="tmais">+15 s</button><button id="tsalta">Saltar</button>
</div>
<nav id="nav"></nav>
<script>
"use strict";
/* ---------- ícones (traço, estilo SF Symbols) ---------- */
const IC = {
  haltere:'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
  grafico:'<path d="M4 19V5M4 19h16M8 15l3.5-4 3 2.5L20 7"/>',
  roda:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  lista:'<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',
  seta:'<path d="M9 5l7 7-7 7"/>',
  voltar:'<path d="M15 5l-7 7 7 7"/>',
  certo:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  certoc:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.8"/>',
  sync:'<path d="M20 11a8 8 0 0 0-14.6-4.5M4 4v3h3M4 13a8 8 0 0 0 14.6 4.5M20 20v-3h-3"/>',
  nuvem:'<path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9.5a4 4 0 0 1-1 7.9z"/><path d="M12 11v5M9.5 13.5L12 16l2.5-2.5"/>',
  disco:'<path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/>',
  chave:'<circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L20 3M16 7l2.5 2.5M18.5 4.5L21 7"/>',
  pessoa:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  copia:'<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/>',
  mais:'<path d="M12 5v14M5 12h14"/>',
  lixo:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'
};
const ic = (n, cls) => `<svg class="i ${cls||""}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- armazenamento ---------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const cfg = () => LS.get("tg_cfg", {chave:"", atleta:"0"});

/* ---------- utilitários ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2, "0");
const isoDia = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const hoje = () => isoDia(new Date());
const DIAS = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
const DIAS_C = ["dom.","seg.","ter.","qua.","qui.","sex.","sáb."];
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const dia = iso => new Date(iso.slice(0,10) + "T12:00:00");
function dataLonga(iso){ const d = dia(iso); const t = DIAS[d.getDay()]; return t.charAt(0).toUpperCase() + t.slice(1) + ", " + d.getDate() + " de " + MESES[d.getMonth()]; }
function dataCurta(iso){ const d = dia(iso); return pad(d.getDate()) + "/" + pad(d.getMonth()+1); }
function dataRel(iso){ const d = dia(iso); const dif = Math.round((d - dia(hoje()))/864e5);
  if (dif === 0) return "Hoje"; if (dif === 1) return "Amanhã"; if (dif === -1) return "Ontem";
  return DIAS_C[d.getDay()] + " " + d.getDate() + " " + MESES[d.getMonth()].slice(0,3) + "."; }
const fmtKg = k => (k == null || k === "") ? "" : String(Math.round(Number(k)*100)/100).replace(".", ",");
const numPT = v => { if (v == null) return null; const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; };
const mmss = s => { s = Math.max(0, Math.round(s)); return Math.floor(s/60) + ":" + pad(s%60); };
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
const milhar = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");

/* ---------- ponte Android ---------- */
const temAndroid = () => typeof window.Android !== "undefined";
const pendentes = {};
window.__httpCb = function(id, res){ const p = pendentes[id]; if (!p) return; delete pendentes[id]; let r; try{ r = JSON.parse(res); }catch(e){ r = {status:0, body:String(res)}; } p(r); };
function http(metodo, caminho, corpo){
  const c = cfg();
  const url = "https://intervals.icu/api/v1" + caminho.replace("{a}", encodeURIComponent(c.atleta || "0"));
  const body = corpo ? JSON.stringify(corpo) : "";
  return new Promise(resolve => {
    if (temAndroid()){
      const id = "h" + Date.now() + Math.random().toString(36).slice(2);
      pendentes[id] = resolve;
      window.Android.http(id, metodo, url, c.chave || "", body);
    } else {
      fetch(url, {method:metodo, headers:{"Authorization":"Basic " + btoa("API_KEY:" + (c.chave||"")), "Content-Type":"application/json"}, body: corpo ? body : undefined})
        .then(r => r.text().then(t => resolve({status:r.status, body:t})))
        .catch(e => resolve({status:0, body:String(e)}));
    }
  });
}
function vibrar(ms){ try{ if (temAndroid()) window.Android.vibrate(ms); else if (navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
function ecraLigado(on){ try{ if (temAndroid()) window.Android.keepScreenOn(!!on); }catch(e){} }
let actx = null;
function bip(){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.22, 0.44].forEach(t => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = t ? 1046 : 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.22, actx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + t + 0.18);
      o.start(actx.currentTime + t); o.stop(actx.currentTime + t + 0.2);
    });
  }catch(e){}
}

/* ---------- leitura dos treinos do Intervals.icu ----------
   Formato 1: Série 1 — Prensa de pernas — 12 reps — 80 kg / Descanso — 90 s
   Formato 2: Prensa de pernas | 3x12 | 80 kg | 90 s */
function lerDescricao(txt){
  const exs = [], notas = [];
  let ultima = null;
  const pega = nome => {
    let e = exs.length ? exs[exs.length-1] : null;
    if (!e || norm(e.nome) !== norm(nome)){ e = {nome:nome.trim(), series:[]}; exs.push(e); }
    return e;
  };
  const kgDe = s => { const m = /([\d]+(?:[.,]\d+)?)\s*kg/i.exec(s || ""); return m ? numPT(m[1]) : null; };
  String(txt || "").split(/\r?\n/).forEach(l0 => {
    const l = l0.trim();
    if (!l || /^\[SLIPSTREAM/i.test(l)) return;
    let m = /^s[ée]rie\s*\d*\s+[—–-]\s+(.+?)\s+[—–-]\s+(\d+)\s*(reps?|repeti\S*|s|seg\S*|")\s*(?:[—–-]\s+(.*))?$/i.exec(l);
    if (m){
      const e = pega(m[1]);
      ultima = {reps:+m[2], unid: /^(s|seg|")/i.test(m[3]) ? "s" : "reps", kg: kgDe(m[4]), descanso:60};
      e.series.push(ultima); return;
    }
    m = /^descanso\s+[—–-]\s+(\d+)\s*(s|seg|min)/i.exec(l);
    if (m){ if (ultima) ultima.descanso = /^min/i.test(m[2]) ? +m[1]*60 : +m[1]; return; }
    if (l.indexOf("|") > 0){
      const p = l.split("|").map(x => x.trim());
      const sr = /(\d+)\s*[x×]\s*(\d+)\s*(s|seg)?/i.exec(p[1] || "");
      if (p[0] && sr){
        const e = pega(p[0]);
        const desc = /(\d+)\s*(s|seg|min)/i.exec(p[3] || "");
        const d = desc ? (/^min/i.test(desc[2]) ? +desc[1]*60 : +desc[1]) : 60;
        for (let i = 0; i < +sr[1]; i++){ ultima = {reps:+sr[2], unid: sr[3] ? "s" : "reps", kg: kgDe(p[2]), descanso:d}; e.series.push(ultima); }
        return;
      }
    }
    if (/^treino de for/i.test(l)) return;
    notas.push(l);
  });
  return {exercicios:exs, notas:notas.join("\n")};
}

  for (let i = h.length - 1; i >= 0; i--){

}

function vHist(){

function grafico(nome){
  const n = norm(nome);
  const pts = hist().map(r => { const e = r.exercicios.find(x => norm(x.nome) === n); if (!e) return null;
    const ks = e.series.filter(s => s.feito && s.kg != null).map(s => s.kg); return ks.length ? {d:r.data, k:Math.max(...ks)} : null; }).filter(Boolean);
  if (!pts.length) return `<div class="vazio">Sem dados.</div>`;
  const ult = pts[pts.length-1], pri = pts[0], mx = Math.max(...pts.map(p=>p.k)), mn = Math.min(...pts.map(p=>p.k));
  const W = 340, H = 140, PE = 34, PD = 14, PT = 14, PB = 24;
  const lo = Math.max(0, mn - (mx - mn || 10) * 0.25), hi = mx + (mx - mn || 10) * 0.25;
  const x = i => pts.length === 1 ? (PE + W - PD)/2 : PE + i*(W - PE - PD)/(pts.length - 1);
  const y = k => PT + (hi - k)/(hi - lo)*(H - PT - PB);
  const linha = pts.map((p,i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.k).toFixed(1)).join(" ");
  const area = pts.length > 1 ? linha + ` L${x(pts.length-1).toFixed(1)} ${H-PB} L${x(0).toFixed(1)} ${H-PB} Z` : "";
  const grelha = [hi, (hi+lo)/2, lo].map(v => `<line x1="${PE}" x2="${W-PD}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--sep)"/><text x="${PE-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${fmtKg(Math.round(v))}</text>`).join("");
  const evo = ult.k - pri.k;
  return `<div class="stats"><div><b>${fmtKg(ult.k)}</b><small>kg, última</small></div><div><b>${fmtKg(mx)}</b><small>kg, máxima</small></div><div><b style="color:${evo>0?"var(--ok)":"var(--txt)"}">${evo>0?"+":""}${fmtKg(evo)}</b><small>kg, evolução</small></div></div>
  <div class="graf"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Carga máxima por treino">
  <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".28"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>
  ${grelha}${area ? `<path d="${area}" fill="url(#ga)" stroke="none"/>` : ""}
  <path d="${linha}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  ${pts.map((p,i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.k).toFixed(1)}" r="${i === pts.length-1 ? 5 : 3}" fill="${i === pts.length-1 ? "var(--acc)" : "var(--grupo)"}" stroke="var(--acc)" stroke-width="2"/>`).join("")}
  <text x="${x(0).toFixed(1)}" y="${H-6}" text-anchor="${pts.length === 1 ? "middle" : "start"}">${dataCurta(pri.d)}</text>
  ${pts.length > 1 ? `<text x="${W-PD}" y="${H-6}" text-anchor="end">${dataCurta(ult.d)}</text>` : ""}</svg></div>`;
}
function vDetalhe(){
  const r = hist().find(x => x.id === detalheId);
  if (!r){ vista = "hist"; return vHist(); }
  const nS = r.exercicios.reduce((a,e)=>a+e.series.filter(s=>s.feito).length,0);
  let html = `<div class="barra"><div class="lado"><button class="lnk" id="bvolt">${ic("voltar")} Histórico</button></div><div class="tit">Resumo</div><div class="lado dir"></div></div>
    <header class="grande" style="padding-top:14px"><h1 style="font-size:28px">${esc(r.nome)}</h1><div class="sub">${esc(dataLonga(r.data))}</div></header><main>
    <div class="grupo" style="margin-top:10px"><div class="stats"><div><b>${r.duracaoMin}</b><small>minutos</small></div><div><b>${nS}</b><small>séries</small></div><div><b>${milhar(volume(r))}</b><small>kg levantados</small></div></div></div>
    <div class="sec">Exercícios</div><div class="grupo">${r.exercicios.map(e => { const f = e.series.filter(s=>s.feito);
      return `<div class="lin sem-ic"><div class="corpo"><div class="t">${esc(e.nome)}</div><div class="d">${f.length ? esc(resumoSeries(f)) : "Não feito"}</div></div>${f.length ? `<span style="color:var(--ok);display:flex">${ic("certoc")}</span>` : ""}</div>`; }).join("")}</div>`;
  if (envioMsg.msg) html += `<div class="msg ${envioMsg.tipo}">${esc(envioMsg.msg)}</div>`;
  html += `<div style="height:24px"></div>`;
  if (!r.enviado && cfg().chave) html += `<button class="btn" id="benv">${ic("nuvem")} Enviar para o Intervals.icu</button><div style="height:10px"></div>`;
  return html + `<button class="btn perigo" id="bapag">Apagar registo</button><div style="height:20px"></div></main>`;
}

/* ---------- vista: definições ---------- */
let defMsg = {msg:"", tipo:""};
function vDef(){
  const c = cfg();
  return `<header class="grande"><h1>Definições</h1></header><main>
  <div class="sec">Intervals.icu</div>
  <div class="grupo form">
    <div class="lin sem-ic"><label for="ichave">Chave</label><input id="ichave" type="password" autocomplete="off" value="${esc(c.chave)}" placeholder="Colar a chave da API"></div>
    <div class="lin sem-ic"><label for="iatl">ID de atleta</label><input id="iatl" inputmode="numeric" value="${esc(c.atleta || "0")}"></div>
  </div>
  <div class="rodape">No Intervals.icu: Settings → Developer Settings → API Key. Deixa o ID de atleta em 0.</div>
  <div style="height:16px"></div><button class="btn pri" id="bgrav">Guardar e testar ligação</button>
  ${defMsg.msg ? `<div class="msg ${defMsg.tipo}">${esc(defMsg.msg)}</div>` : ""}
  <div class="sec">Cópia de segurança</div>
  <textarea id="tback" aria-label="Cópia de segurança do histórico">${esc(JSON.stringify(hist()))}</textarea>
  <div class="rodape">O histórico fica só neste telemóvel. Copia este texto para um lugar seguro, ou cola aqui uma cópia antiga e carrega em Repor.</div>
  <div style="height:12px"></div><button class="btn" id="brepor">Repor a partir do texto</button>
  <div class="versao">Treino Ginásio · versão ${esc(versao())}</div></main>`;
}
function versao(){ try{ return temAndroid() ? window.Android.version() : "web"; }catch(e){ return "?"; } }

/* ---------- eventos ---------- */
function ligar(){
  document.querySelectorAll("[data-abrir]").forEach(el => el.onclick = () => abrirTreino(el.dataset.abrir));
  document.querySelectorAll("[data-det]").forEach(el => el.onclick = () => { detalheId = el.dataset.det; envioMsg = {msg:"",tipo:""}; vista = "detalhe"; desenhar(); window.scrollTo(0,0); });
  const on = (id, f) => { const el = $(id); if (el) el.onclick = f; };
  on("#bsync", sincronizar);
  on("#bfim", terminar); on("#bfim2", terminar);
  on("#bcanc", () => { if (confirm("Sair e descartar este treino?")) descartar(); });
  on("#bvolt", () => irPara("hist"));
  on("#benv", () => enviar(detalheId));
  on("#bapag", () => { if (!confirm("Apagar este registo do histórico?")) return; LS.set("tg_hist", hist().filter(x => x.id !== detalheId)); irPara("hist"); });
  const sel = $("#selex"); if (sel) sel.onchange = () => { exGraf = sel.value; desenhar(); };
  on("#bgrav", async () => {
    LS.set("tg_cfg", {chave:$("#ichave").value.trim(), atleta:($("#iatl").value.trim() || "0")});
    if (!cfg().chave){ defMsg = {msg:"Guardado sem chave: só os treinos de base ficam disponíveis.", tipo:""}; desenhar(); return; }
    defMsg = {msg:"A testar…", tipo:""}; desenhar();
    const r = await http("GET", "/athlete/{a}");
    let nome = ""; try{ nome = JSON.parse(r.body).name || ""; }catch(e){}
    defMsg = r.status === 200 ? {msg:"Ligação feita" + (nome ? ": " + nome : "") + ".", tipo:"ok"} : {msg:"Erro " + r.status + ": chave ou ID de atleta inválidos.", tipo:"err"};
    desenhar();
    if (r.status === 200) sincronizar();
  });
  on("#brepor", () => {
    let d; try{ d = JSON.parse($("#tback").value); }catch(e){ alert("O texto não é uma cópia de segurança válida."); return; }
    if (!Array.isArray(d)){ alert("O texto não é uma cópia de segurança válida."); return; }
    if (!confirm("Substituir o histórico actual por " + d.length + " treino(s)?")) return;
    LS.set("tg_hist", d); defMsg = {msg:"Histórico reposto: " + d.length + " treino(s).", tipo:"ok"}; desenhar();
  });
  /* sessão */
  if (vista !== "sessao" || !LS.get("tg_ativa", null)) return;
  const par = v => v.split("-").map(Number);
  document.querySelectorAll("[data-kg]").forEach(el => el.onchange = () => { const [a,b] = par(el.dataset.kg); const x = LS.get("tg_ativa"); x.exercicios[a].series[b].kg = numPT(el.value);
    for (let i = b+1; i < x.exercicios[a].series.length; i++){ const y = x.exercicios[a].series[i]; if (!y.feito && y.kg == null) y.kg = numPT(el.value); }
    guardarAtiva(x); });
  document.querySelectorAll("[data-rp]").forEach(el => el.onchange = () => { const [a,b] = par(el.dataset.rp); const x = LS.get("tg_ativa"); const n = parseInt(el.value,10); if (!isNaN(n)) x.exercicios[a].series[b].reps = n; guardarAtiva(x); });
  document.querySelectorAll("[data-ok]").forEach(el => el.onclick = () => {
    const [a,b] = par(el.dataset.ok); const x = LS.get("tg_ativa"); const sr = x.exercicios[a].series[b];
    sr.kg = numPT($("#kg-" + a + "-" + b).value); const n = parseInt($("#rp-" + a + "-" + b).value,10); if (!isNaN(n)) sr.reps = n;
    sr.feito = !sr.feito;
    if (sr.feito){ const nx = x.exercicios[a].series[b+1]; if (nx && !nx.feito && nx.kg == null) nx.kg = sr.kg; }
    guardarAtiva(x);
    if (sr.feito){
      const ultimaDoEx = b === x.exercicios[a].series.length - 1;
      const prox = ultimaDoEx ? (x.exercicios[a+1] ? "A seguir: " + x.exercicios[a+1].nome : "Último exercício feito") : "Série " + (b+2) + " · " + x.exercicios[a].nome;
      iniciarTimer(sr.descanso || 60, prox);
    }
    const y = window.scrollY; desenhar(); window.scrollTo(0, y);
  });
  document.querySelectorAll("[data-add]").forEach(el => el.onclick = () => { const a = +el.dataset.add; const x = LS.get("tg_ativa"); const ss = x.exercicios[a].series; const l = ss[ss.length-1] || {reps:10,unid:"reps",kg:null,descanso:60};
    ss.push({reps:l.reps, unid:l.unid, kg:l.kg, descanso:l.descanso, feito:false}); guardarAtiva(x); const y = window.scrollY; desenhar(); window.scrollTo(0, y); });
  actualizarCrono();
}

/* ---------- arranque ---------- */
if (LS.get("tg_ativa", null)){ vista = "sessao"; ecraLigado(true); }
desenhar();
if (cfg().chave) sincronizar();
</script>
</body>
</html>
